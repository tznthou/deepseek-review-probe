# 第二段：模擬 04-ai-review-post —— 由 workflow_run 觸發。
#
# ⭐ 驗兩件事：
#   Q1（已驗通）由 `workflow_run` 觸發的 workflow，能不能 `uses:` 另一個 repo 的 reusable workflow
#   Q3（本次）  跨 repo 的 caller，secret 要用 `inherit` 還是必須明確傳
name: probe post

on:
  workflow_run:
    workflows: ['probe collect']
    types: [completed]

permissions:
  contents: read

jobs:
  # Q3-A：`secrets: inherit`。官方文件說這關鍵字是給「同 organization 或 enterprise」用的。
  # caller 與 reusable 分屬不同 repo、但同一個個人帳號 —— 算不算？
  via-inherit:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    uses: tznthou/deepseek-code-review/.github/workflows/reusable-probe.yml@probe/reusable-workflow-run
    with:
      note: 'Q3-A secrets inherit'
    secrets: inherit

  # Q3-B：明確傳。跨帳號一定可行的寫法，當對照組。
  via-explicit:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    uses: tznthou/deepseek-code-review/.github/workflows/reusable-probe.yml@probe/reusable-workflow-run
    with:
      note: 'Q3-B 明確傳 secret'
    secrets:
      PROBE_SECRET: ${{ secrets.PROBE_SECRET }}

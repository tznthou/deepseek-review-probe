name: code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  static:
    uses: tznthou/deepseek-code-review/.github/workflows/reusable-static-review.yml@feat/reusable-workflows
    with:
      lint-command: shellcheck -f gcc $(git ls-files '*.sh')
      lint-name: shellcheck
      # 這個 repo 沒有依賴清單
      skip-dependency-review: true

  codeql:
    uses: tznthou/deepseek-code-review/.github/workflows/reusable-codeql.yml@feat/reusable-workflows
    with:
      languages: '["python"]'
